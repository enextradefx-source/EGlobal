<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EnexTrade Global Markets — learn to trade, copy proven strategies, and follow premium signals."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>EnexTrade Global Markets — Trade. Learn. Copy.</title>
    <script>
      try {
        var stored = localStorage.getItem('enex-theme')
        var hour = new Date().getHours()
        var theme = stored || (hour >= 19 || hour < 6 ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
